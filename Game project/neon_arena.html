<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON ARENA // Cyber Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050711;font-family:Inter,system-ui,sans-serif;color:#fff}
body{display:grid;place-items:center}
canvas{width:100vw;height:100vh;display:block;background:radial-gradient(circle at 50% 45%,#101833 0,#070b18 45%,#03040a 100%)}
#hud{position:fixed;inset:0;pointer-events:none;padding:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.panel{background:rgba(5,8,20,.72);border:1px solid rgba(120,180,255,.2);box-shadow:0 0 30px rgba(50,120,255,.08);backdrop-filter:blur(8px);padding:12px 16px;border-radius:14px}
.title{font-weight:900;letter-spacing:3px;font-size:18px}.sub{font-size:11px;color:#7f93b8;letter-spacing:2px;margin-top:4px}
.stat{font-size:13px;color:#aebbd6}.stat b{color:#fff}
#bar{width:210px;height:8px;background:#172036;border-radius:8px;margin-top:8px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#43ffd2,#5b8cff);box-shadow:0 0 15px #43ffd2}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,4,10,.55);backdrop-filter:blur(5px)}
.card{width:min(560px,90vw);padding:34px;border-radius:24px;text-align:center;background:rgba(8,12,29,.92);border:1px solid rgba(111,165,255,.28);box-shadow:0 20px 80px rgba(0,0,0,.55)}
h1{margin:0;font-size:clamp(36px,7vw,72px);letter-spacing:6px;line-height:.9;background:linear-gradient(90deg,#5b8cff,#43ffd2,#d06bff);-webkit-background-clip:text;color:transparent}
.card p{color:#a9b6d0;line-height:1.6}
button{border:0;border-radius:12px;padding:14px 24px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#5b8cff,#43ffd2);color:#06101b;cursor:pointer;box-shadow:0 0 25px rgba(67,255,210,.2)}
#help{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#667695;font-size:11px;letter-spacing:1px}
@media(max-width:600px){#help{font-size:9px}.panel{padding:9px 11px}.title{font-size:14px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="top">
    <div class="panel"><div class="title">NEON ARENA</div><div class="sub">CYBER RUSH // SURVIVAL</div></div>
    <div class="panel">
      <div class="stat">WAVE <b id="wave">1</b> &nbsp; SCORE <b id="score">0</b></div>
      <div class="stat">COMBO <b id="combo">x1</b></div>
      <div id="bar"><div id="hp"></div></div>
    </div>
  </div>
</div>
<div id="overlay">
  <div class="card">
    <h1 id="headline">NEON<br>ARENA</h1>
    <p id="desc">Survive the escalating waves. Dash through danger, destroy drones, collect energy shards and build your combo.</p>
    <button id="start">START RUN</button>
  </div>
</div>
<div id="help">WASD / ARROWS • MOUSE AIM • CLICK / SPACE SHOOT • SHIFT DASH • ESC PAUSE</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,DPR,playing=false,paused=false,last=0,score=0,wave=1,spawn=0,spawnRate=1.05,combo=1,comboTimer=0;
const keys={},bullets=[],enemies=[],particles=[],orbs=[],stars=[];
const mouse={x:0,y:0,down:false};
const player={x:0,y:0,r:17,hp:100,max:100,speed:310,fire:0,dash:0,inv:0};

function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(!playing){player.x=W/2;player.y=H/2}}
addEventListener('resize',resize);resize();
for(let i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*2+.3,a:Math.random()*.7+.2});

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault()}if(e.key==='Escape'&&playing)paused=!paused});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);

function burst(x,y,n=12,col='#5b8cff',power=1){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=(40+Math.random()*180)*power;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.6,max:.8,r:1+Math.random()*3,col})}}
function shoot(){let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a)*760,vy:Math.sin(a)*760,r:4,life:1});player.fire=.13;burst(player.x+Math.cos(a)*18,player.y+Math.sin(a)*18,3,'#43ffd2',.5)}
function spawnEnemy(){
 let side=Math.floor(Math.random()*4),x,y;
 if(side===0){x=-40;y=Math.random()*H}else if(side===1){x=W+40;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=-40}else{x=Math.random()*W;y=H+40}
 let type=Math.random()<Math.min(.18+wave*.015,.35)?'hunter':'drone';
 enemies.push({x,y,r:type==='hunter'?19:14,hp:type==='hunter'?3+Math.floor(wave/3):1+Math.floor(wave/5),type,speed:type==='hunter'?80+wave*3:110+wave*4,phase:Math.random()*7});
}
function start(){
 playing=true;paused=false;score=0;wave=1;combo=1;comboTimer=0;player.hp=100;player.x=W/2;player.y=H/2;
 bullets.length=enemies.length=particles.length=orbs.length=0;spawnRate=1.05;document.getElementById('overlay').style.display='none';
}
document.getElementById('start').onclick=start;

function update(dt){
 if(!playing||paused)return;
 const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 let len=Math.hypot(dx,dy)||1;
 let sp=player.speed*(player.dash>0?2.7:1);player.x+=dx/len*sp*dt;player.y+=dy/len*sp*dt;
 player.x=Math.max(22,Math.min(W-22,player.x));player.y=Math.max(22,Math.min(H-22,player.y));
 if((keys.shift)&&player.dash<=0){player.dash=.28;player.inv=.35;burst(player.x,player.y,20,'#d06bff',1.5)}
 player.dash=Math.max(0,player.dash-dt);player.inv=Math.max(0,player.inv-dt);
 player.fire-=dt;if((mouse.down||keys[' '])&&player.fire<=0)shoot();

 spawn-=dt;if(spawn<=0){spawnEnemy();spawn=spawnRate}
 let targetWave=1+Math.floor(score/900);if(targetWave>wave){wave=targetWave;spawnRate=Math.max(.32,1.05-wave*.055);burst(W/2,H/2,45,'#d06bff',1.4)}
 for(let b=bullets.length-1;b>=0;b--){let q=bullets[b];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0||q.x<-50||q.x>W+50||q.y<-50||q.y>H+50)bullets.splice(b,1)}
 for(let e=enemies.length-1;e>=0;e--){
  let q=enemies[e],a=Math.atan2(player.y-q.y,player.x-q.x),waveS=1+wave*.035;
  let sway=q.type==='hunter'?Math.sin(performance.now()/300+q.phase)*.45:0;
  q.x+=Math.cos(a+sway)*q.speed*waveS*dt;q.y+=Math.sin(a+sway)*q.speed*waveS*dt;
  if(Math.hypot(q.x-player.x,q.y-player.y)<q.r+player.r){
   if(player.inv<=0){player.hp-=q.type==='hunter'?18:10;player.inv=.6;burst(player.x,player.y,18,'#ff5d8f',1);combo=1}
   enemies.splice(e,1);continue;
  }
  for(let b=bullets.length-1;b>=0;b--){let z=bullets[b];if(Math.hypot(z.x-q.x,z.y-q.y)<q.r+z.r){q.hp--;bullets.splice(b,1);burst(z.x,z.y,7,'#43ffd2',.8);if(q.hp<=0){score+=q.type==='hunter'?140:60;combo=Math.min(9,combo+.25);comboTimer=2.2;if(Math.random()<.13)orbs.push({x:q.x,y:q.y,r:8,life:7});burst(q.x,q.y,25,q.type==='hunter'?'#d06bff':'#5b8cff',1.3);enemies.splice(e,1)}break}}
 }
 for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];o.life-=dt;let d=Math.hypot(player.x-o.x,player.y-o.y);if(d<90){o.x+=(player.x-o.x)*dt*4;o.y+=(player.y-o.y)*dt*4}if(d<player.r+o.r){score+=100;player.hp=Math.min(100,player.hp+6);burst(o.x,o.y,14,'#43ffd2',1);orbs.splice(i,1)}else if(o.life<=0)orbs.splice(i,1)}
 comboTimer-=dt;if(comboTimer<=0)combo=1;
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 if(player.hp<=0)gameOver();
 document.getElementById('score').textContent=Math.floor(score);document.getElementById('wave').textContent=wave;document.getElementById('combo').textContent='x'+Math.floor(combo);document.getElementById('hp').style.width=Math.max(0,player.hp)+'%';
}
function gameOver(){playing=false;document.getElementById('overlay').style.display='grid';document.getElementById('headline').innerHTML='RUN<br>ENDED';document.getElementById('desc').innerHTML=`Score: <b>${Math.floor(score)}</b> &nbsp; • &nbsp; Wave: <b>${wave}</b><br>Press START to launch another run.`;document.getElementById('start').textContent='RESTART'}
function draw(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#111b3a');g.addColorStop(1,'#03040a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#a9c9ff';ctx.fillRect(s.x*W,s.y*H,s.s,s.s)}ctx.restore();
 ctx.strokeStyle='rgba(100,150,255,.07)';ctx.lineWidth=1;let grid=70,off=(performance.now()/30)%grid;for(let x=-grid+off;x<W+grid;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-grid+off;y<H+grid;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const o of orbs){ctx.shadowBlur=22;ctx.shadowColor='#43ffd2';ctx.fillStyle='#43ffd2';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.shadowBlur=0}
 for(const b of bullets){ctx.shadowBlur=18;ctx.shadowColor='#43ffd2';ctx.fillStyle='#c9fff5';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0}
 for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);let col=e.type==='hunter'?'#d06bff':'#5b8cff';ctx.shadowBlur=25;ctx.shadowColor=col;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.fillStyle='rgba(8,12,29,.9)';ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.stroke();ctx.rotate(performance.now()/700);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.moveTo(-e.r-5,0);ctx.lineTo(e.r+5,0);ctx.moveTo(0,-e.r-5);ctx.lineTo(0,e.r+5);ctx.stroke();ctx.restore()}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
 // player
 let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);
 ctx.shadowBlur=30;ctx.shadowColor='#43ffd2';ctx.fillStyle='#43ffd2';ctx.beginPath();ctx.moveTo(23,0);ctx.lineTo(-12,-13);ctx.lineTo(-6,0);ctx.lineTo(-12,13);ctx.closePath();ctx.fill();
 ctx.fillStyle='#07101c';ctx.beginPath();ctx.arc(1,0,7,0,7);ctx.fill();ctx.restore();
 if(player.inv>0){ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,27+Math.sin(performance.now()/60)*3,0,7);ctx.stroke()}
 if(paused&&playing){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 42px system-ui';ctx.fillText('PAUSED',W/2,H/2)}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
